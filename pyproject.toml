[project]
name = "pq35-flasher-ui"
version = "0.1.0"
description = "Desktop UI for the PQ35 Haldex Gen4 / EPS flasher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.7",
    # CAN backends for the 64-bit worker. J2534 needs none of these; it runs
    # in a separate stdlib-only 32-bit worker.
    "python-can>=4.3",
    "gs_usb>=0.3",
    "pyusb>=1.2",
    "libusb-package>=1.0",
]

[project.gui-scripts]
pq35-flasher = "pq35ui.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pq35ui", "flasher"]

[tool.uv]
# Always uv's own 64-bit CPython for the UI, never a system Python (which may
# be a 32-bit J2534 one that PySide6 can't run on). install.ps1 adds a separate
# 32-bit interpreter for the J2534 worker.
python-preference = "only-managed"
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
